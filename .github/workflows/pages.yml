# Builds the static demo (no server, forms send nothing) and deploys it to GitHub Pages:
# https://derhoodaus-commits.github.io/faserlauf-furniture-configurator-demo/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site: https://<owner>.github.io/<repo>/
      BASE_PATH: /${{ github.event.repository.name }}/
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the static site
        run: npm run build:pages
      - name: Check every internal link under the sub-path
        run: node tests/pages-build.mjs --no-build
      - uses: actions/configure-pages@v5
      # v4 leaves dotfiles (.nojekyll) out of the artifact; that's fine: Pages deployed from an Actions artifact
      # never runs Jekyll, so _astro/ is served as is. .nojekyll only matters for branch-based deployments.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
